<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC 5-Min AI · Polymarket paper trader</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#EDF0F3;--card:#fff;--line:#D8DEE6;--ink:#101B2D;--muted:#5A6779;--acc:#0F6B66;--acc2:#3557C4;--win:#11803F;--loss:#BF2F2F;--winbg:#DDF3E5;--lossbg:#F9E1E0;--hyp:#8A5A00;--hypbg:#FCEFD3;--soft:#F5F7F9}
@media (prefers-color-scheme:dark){:root{--bg:#0B1017;--card:#131A24;--line:#263140;--ink:#E8EDF3;--muted:#93A1B3;--acc:#3CC4B7;--acc2:#7C9BFF;--win:#4ADE80;--loss:#F87171;--winbg:#12301F;--lossbg:#381616;--hyp:#F5C04E;--hypbg:#33280F;--soft:#0F151E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;letter-spacing:.03em;text-transform:uppercase}h2{margin:0 0 10px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h3{margin:0 0 6px;font-size:15px}
.sub{color:var(--muted);font-size:12.5px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.b-paper{background:var(--hypbg);color:var(--hyp)}.b-ok{background:var(--winbg);color:var(--win)}.b-bad{background:var(--lossbg);color:var(--loss)}
.b-meas{background:var(--winbg);color:var(--win)}.b-hyp{background:var(--hypbg);color:var(--hyp)}.b-ev{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--acc)}
.big{font-size:26px;font-weight:650}.pos{color:var(--win)}.neg{color:var(--loss)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.4fr 1fr}.g2e{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.g2,.g2e,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.kpi .v{font-size:19px;font-weight:650;margin-top:2px}.kpi .s{font-size:11.5px;color:var(--muted)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:13px}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}td.l,th.l{text-align:left;white-space:normal}.scroll{overflow-x:auto}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;margin:1px 2px 1px 0;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.tag.w{background:var(--winbg);color:var(--win);border-color:transparent}.tag.l{background:var(--lossbg);color:var(--loss);border-color:transparent}
.note{font-size:12px;color:var(--muted)}ul{margin:0;padding-left:18px}li{margin:3px 0}
.feed{max-height:560px;overflow:auto}.fr{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.fr .t{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.k-trade{color:var(--acc);font-weight:600}.k-model{color:var(--acc2);font-weight:600}.k-risk{color:var(--loss);font-weight:600}.k-experiment{color:var(--hyp)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:var(--acc)}
.pb{display:grid;grid-template-columns:150px 1fr 52px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.entry{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:10px;background:var(--card)}
.entry .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
.count{font-size:34px;font-weight:700}
.empty{color:var(--muted);font-style:italic;padding:8px 0}
.chart{height:300px}
.hide{display:none}
.warn{padding:9px 12px;border-radius:8px;background:var(--hypbg);color:var(--hyp);font-size:13px}
.side-up{color:var(--win);font-weight:700}.side-down{color:var(--loss);font-weight:700}
svg text{fill:var(--muted);font-size:10px}
.card svg{max-width:440px;margin:0 auto}td.l{min-width:220px}
</style></head><body>
<div class="top"><div class="wrap">
  <div class="head">
    <div><h1>BTC 5-Minute AI <span class="badge b-paper">Paper trading</span></h1>
      <div class="sub" id="sub">Loading…</div></div>
    <div style="text-align:right"><div class="sub">Equity (paper USDC)</div><div class="big mono" id="eq">–</div></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div></div>
<div class="wrap" id="main"><div class="empty">Loading the latest data…</div></div>
<script>
const OWNER = location.hostname.endsWith('github.io') ? location.hostname.split('.')[0] : 'caelemiles';
const REPO = (location.hostname.endsWith('github.io') && location.pathname.split('/')[1]) || 'crypto-desk';
const BR = 'pm5-data';
const PAGES = ['Overview','Live AI','Market Data','Paper Trading','Learning Journal','Strategy Lab','Model Performance','Model History','Settings'];
let page = (location.hash||'').slice(1).replace(/-/g,' ') || 'Overview'; if(!PAGES.includes(page)) page='Overview';
let L = null, D = null, sha = null, jfilter = 'all', charts = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d=2) => v==null || isNaN(v) ? '–' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = (v, d=2) => v==null ? '–' : (v<0?'-$':'$') + num(Math.abs(v), d);
const sgn = (v, d=2) => v==null ? '–' : (v>=0?'+':'-') + '$' + num(Math.abs(v), d);
const pct = (v, d=1) => v==null ? '–' : (v*100).toFixed(d) + '%';
const cls = v => v==null ? '' : v>0 ? 'pos' : v<0 ? 'neg' : '';
const tsg = (ts, withDate) => { if(!ts) return '–'; const d = new Date(ts*1000); const o = {timeZone:'Asia/Singapore',hour:'2-digit',minute:'2-digit',hour12:false}; if(withDate){o.day='2-digit';o.month='short'} return d.toLocaleString('en-GB', o); };
const ago = ts => { if(!ts) return '–'; const s = Date.now()/1000 - ts; if(s<90) return Math.round(s)+'s ago'; if(s<5400) return Math.round(s/60)+' min ago'; return (s/3600).toFixed(1)+' h ago'; };
const ev = e => e==='measured' ? '<span class="badge b-meas">measured</span>' : e==='hypothesis' ? '<span class="badge b-hyp">hypothesis</span>' : '<span class="badge b-ev">event</span>';
const side = s => s ? `<span class="side-${String(s).toLowerCase()}">${esc(String(s).toUpperCase())}</span>` : '–';
const kpi = (k, v, s, c) => `<div class="kpi"><div class="k">${k}</div><div class="v mono ${c||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const table = (heads, rows, empty) => rows.length ? `<div class="scroll"><table><tr>${heads.map(h=>`<th class="${h.startsWith('_')?'l':''}">${h.replace(/^_/,'')}</th>`).join('')}</tr>${rows.join('')}</table></div>` : `<div class="empty">${empty||'Nothing yet.'}</div>`;

async function getJSON(url){ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function latestSha(){
  try { const b = await getJSON(`https://api.github.com/repos/${OWNER}/${REPO}/branches/${BR}`); return b.commit.sha; } catch(e){ return null; }
}
const SRC = new URLSearchParams(location.search).get('src');  // optional override, used for local testing
async function load(full){
  const s = SRC ? 'local' : await latestSha();
  const base = SRC ? SRC : s ? `https://raw.githubusercontent.com/${OWNER}/${REPO}/${s}/` : `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BR}/`;
  try { L = await getJSON(base + 'live.json?t=' + Date.now()); } catch(e){ if(!L){ $('#main').innerHTML = '<div class="card">No data yet. The bot publishes its first results a few minutes after it starts.</div>'; return; } }
  if(full || !D || s !== sha){ try { const d = await getJSON(base + 'data.json?t=' + Date.now()); if(!D || d.generated !== D.generated) D = d; } catch(e){} }
  sha = s; render();
}
function header(){
  const o = L.overview, h = L.health||{}, now = Date.now()/1000;
  const age = now - L.generated;
  const healthy = age < 400 && (h.chainlink?.age_s ?? 999) < 30;
  $('#eq').innerHTML = `<span class="${cls(o.net_pnl)}">${usd(o.equity)}</span>`;
  $('#sub').innerHTML = `<span class="badge ${healthy?'b-ok':'b-bad'}">${healthy?'running':'check status'}</span> updated ${ago(L.generated)} · champion ${esc(o.champion||'–')} · net ${sgn(o.net_pnl)} (${pct(o.roi)}) · all times SGT`;
  $('#tabs').innerHTML = PAGES.map(p=>`<button class="tab ${p===page?'on':''}" data-p="${p}">${p}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{page=b.dataset.p; location.hash=page.replace(/ /g,'-'); render(); window.scrollTo(0,0);});
}
function render(){
  if(!L) return;
  if(!L.overview){ $('#sub').innerHTML = 'starting up · '+ago(L.generated); $('#main').innerHTML = `<div class="card" style="margin-top:14px"><h2>Starting up</h2><p>The AI is loading history and training its first models. Live data appears within about 15 minutes.</p><div class="feed">${feedHTML(L.activity, 40)}</div></div>`; return; }
  header(); charts.forEach(c=>{try{c.remove()}catch(e){}}); charts=[];
  const f = {'Overview':pOverview,'Live AI':pLive,'Market Data':pMarket,'Paper Trading':pTrading,'Learning Journal':pJournal,'Strategy Lab':pLab,'Model Performance':pPerf,'Model History':pHistory,'Settings':pSettings}[page];
  $('#main').innerHTML = f(); afterRender();
}
let after = []; function afterRender(){ const a = after; after=[]; a.forEach(fn=>{try{fn()}catch(e){console.error(e)}}); }

function feedHTML(items, n){
  const rows = (items||[]).slice(-n).reverse();
  return rows.length ? rows.map(a=>`<div class="fr"><div class="t">${esc(a.time||tsg(a.ts))}</div><div class="k-${esc(a.kind)}">${esc(a.text)}</div></div>`).join('') : '<div class="empty">No activity yet.</div>';
}
function marketCard(){
  const lv = L.live||{}, m = lv.market||{}, c = lv.champion||{};
  if(!m.slug) return '<div class="empty">Waiting for the next market…</div>';
  const left = Math.max(0, (m.end||0) - Date.now()/1000);
  const up = m.book?.up||{};
  const mkt = up.mid;
  const dec = c.decision ? `Traded: bought ${side(c.decision.side)} at ${c.decision.t}s (model ${pct(c.decision.p_side,0)})` :
              c.missed ? `Wanted to trade but: ${esc(c.missed.reason)}` :
              c.best_reject ? `No trade yet - best idea: ${side(c.best_reject.side)} edge ${num(c.best_reject.edge,3)} (${esc(c.best_reject.reason)})` :
              (m.problems && m.problems.length ? 'Not trading: ' + esc(m.problems.join('; ')) : 'Watching - no edge yet');
  return `<h3>${esc(m.title||m.slug)}</h3>
  <div class="sub">${m.t}s in · ${Math.round(left)}s left at last update · <a href="https://polymarket.com/event/${esc(m.slug)}" target="_blank" rel="noopener">open on Polymarket</a></div>
  <div class="pb" style="margin-top:10px"><span>AI P(UP)</span><div class="bar"><i style="width:${(c.p_up??0)*100}%"></i></div><b class="mono">${pct(c.p_up,0)}</b></div>
  <div class="pb"><span>Market price UP</span><div class="bar"><i style="width:${(mkt??0)*100}%;background:var(--acc2)"></i></div><b class="mono">${pct(mkt,0)}</b></div>
  <div class="note" style="margin-top:6px">${dec}</div>`;
}
function pOverview(){
  const o = L.overview;
  const k = [kpi('Equity', usd(o.equity), `start ${usd(o.start_balance,0)}`, cls(o.net_pnl)), kpi('Net P&L', sgn(o.net_pnl), pct(o.roi)+' ROI', cls(o.net_pnl)),
    kpi('Today', sgn(o.daily_pnl), '', cls(o.daily_pnl)), kpi('7 days', sgn(o.weekly_pnl), '', cls(o.weekly_pnl)), kpi('30 days', sgn(o.monthly_pnl), '', cls(o.monthly_pnl)),
    kpi('Trades', o.trades, `${o.open_positions} open`), kpi('Win rate', pct(o.win_rate), 'profitable trades'), kpi('Avg win / loss', `${usd(o.avg_win)} / ${usd(o.avg_loss)}`),
    kpi('Max drawdown', pct(o.max_drawdown), 'from peak'), kpi('Brier score', num(o.brier,4), `${o.brier_n} markets · lower is better`), kpi('Fees paid', usd(o.fees))].join('');
  const dr = D?.journal?.daily?.slice(-1)[0];
  after.push(()=>equityChart('#eqc'));
  return `<div class="grid" style="margin-top:14px">
   ${o.paused_until?`<div class="warn">New entries paused until ${tsg(o.paused_until)} (risk limit).</div>`:''}
   <div class="kpis">${k}</div>
   <div class="grid g2">
     <div class="grid">
       <div class="card"><h2>Active market</h2>${marketCard()}</div>
       <div class="card"><h2>Equity curve</h2><div id="eqc" class="chart" style="height:240px"></div></div>
       <div class="card"><h2>Latest daily learning report</h2>${dr?dailyHTML(dr,true):'<div class="empty">The first report is written after midnight (SGT).</div>'}</div>
     </div>
     <div class="card"><h2>AI activity · live</h2><div class="feed">${feedHTML(L.activity, 60)}</div></div>
   </div></div>`;
}
function equityChart(sel){
  const el = $(sel); if(!el || !window.LightweightCharts || !D?.equity_curve?.length){ if(el) el.innerHTML='<div class="empty">The equity curve appears after the first few hours.</div>'; return; }
  const ch = mkChart(el); const s = ch.addAreaSeries({lineColor:css('--acc'), topColor:css('--acc')+'55', bottomColor:css('--acc')+'05', lineWidth:2});
  s.setData(D.equity_curve.map(([t,v])=>({time:t+8*3600,value:v}))); ch.timeScale().fitContent();
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function mkChart(el){ const ch = LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:'transparent'},textColor:css('--muted')},grid:{vertLines:{color:css('--line')},horzLines:{color:css('--line')}},rightPriceScale:{borderColor:css('--line')},timeScale:{borderColor:css('--line'),timeVisible:true,secondsVisible:false}}); charts.push(ch); return ch; }

function pLive(){
  const lv = L.live||{}, m = lv.market||{}, c = lv.champion||{}, f = lv.features||{};
  const models = (lv.models||[]).slice().sort((a,b)=>a.kind==='market'?-1:b.kind==='market'?1:0);
  const bars = models.map(x=>`<div class="pb"><span title="${esc(x.desc)}">${esc(x.id)} ${x.id===c.model?'★':''} <span class="note">${esc(x.kind)}</span></span><div class="bar"><i style="width:${x.p_up*100}%;${x.kind==='market'?'background:var(--acc2)':''}"></i></div><b class="mono">${pct(x.p_up,1)}</b></div>`).join('');
  const depth = s => { const b = m.book?.[s]; if(!b) return '<div class="empty">No book</div>'; const n = Math.max(b.depth_bid.length, b.depth_ask.length); let r=[]; for(let i=0;i<Math.min(n,6);i++){ const bi=b.depth_bid[i], a=b.depth_ask[i]; r.push(`<tr><td>${bi?num(bi[1],0):''}</td><td class="pos">${bi?bi[0].toFixed(2):''}</td><td class="neg">${a?a[0].toFixed(2):''}</td><td>${a?num(a[1],0):''}</td></tr>`);} return table(['Bid size','Bid','Ask','Ask size'], r); };
  const h = L.health||{};
  const hr = Object.entries(h).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.age_s==null?'never':v.age_s+'s'}</td><td>${v.errors}</td><td class="l note">${esc(v.last_error||'')}</td></tr>`);
  const feats = Object.entries(f).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="mono">${v==null?'–':typeof v==='number'?(Math.abs(v)<0.01&&v!==0?v.toExponential(2):num(v,4)):esc(v)}</td></tr>`);
  return `<div class="grid" style="margin-top:14px">
  <div class="grid g2">
    <div class="card"><h2>Current analysis</h2>${marketCard()}
      <div class="kv" style="margin-top:12px">
        <div>Price to beat (Chainlink TWAP at open)</div><div class="mono">${m.open_ref?'$'+num(m.open_ref,2):'not published yet'}</div>
        <div>Chainlink BTC/USD now</div><div class="mono">${m.cl_price?'$'+num(m.cl_price,2):'–'}</div>
        <div>Distance to price to beat</div><div class="mono ${cls(m.d_bp)}">${m.d_bp==null?'–':num(m.d_bp,2)+' bp'}</div>
        <div>Settlement TWAP already observed</div><div class="mono">${pct(m.twap_frac,0)}</div>
        <div>Fair-value z-score</div><div class="mono">${num(m.z,2)}</div>
        <div>Volatility ratio (1 min vs 15 min)</div><div class="mono">${num(m.vol_ratio,2)}</div>
        <div>Taker fee rate</div><div class="mono">${m.fee_rate??'–'}</div>
        <div>Liquidity / volume</div><div class="mono">${usd(m.liquidity,0)} / ${usd(m.volume,0)}</div>
      </div>
      ${m.not_tradable?`<div class="note" style="margin-top:8px">Not tradable now: ${esc(m.not_tradable)}</div>`:''}
    </div>
    <div class="card"><h2>Every model's probability of UP</h2>${bars||'<div class="empty">No predictions yet this market.</div>'}
      <div class="note">★ = model used by the champion. Blue = the market's own price, the benchmark to beat.</div>
      <h2 style="margin-top:14px">Champion decision</h2>
      <div class="kv"><div>Strategy</div><div>${esc(c.id)}</div>
      <div>Decision</div><div>${c.decision?`bought ${side(c.decision.side)} at ${c.decision.t}s`:'no trade (yet)'}</div>
      <div>Best rejected idea</div><div>${c.best_reject?`${side(c.best_reject.side)} @ ${c.best_reject.ask} · edge ${num(c.best_reject.edge,3)} · ${esc(c.best_reject.reason)}`:'–'}</div>
      <div>Blocked trade</div><div>${c.missed?esc(c.missed.reason):'–'}</div></div>
    </div>
  </div>
  <div class="grid g2e"><div class="card"><h2>Order book · UP</h2>${depth('up')}</div><div class="card"><h2>Order book · DOWN</h2>${depth('down')}</div></div>
  <div class="grid g2e"><div class="card"><h2>Indicators the models see</h2>${table(['Feature','Value'], feats)}</div>
  <div class="card"><h2>Data feeds</h2>${table(['Feed','Last OK','Errors','_Last error'], hr)}
    <div class="note" style="margin-top:8px">Run ${esc(L.run?.id)} · started ${tsg(L.run?.started,1)} · hands over at ${tsg(L.run?.ends,1)} · ${L.run?.loops} loops · ${L.run?.errors} errors · Chainlink reconnects ${L.run?.chainlink_reconnects}</div></div></div>
  </div>`;
}
function pMarket(){
  if(!D) return '<div class="empty">Loading…</div>';
  const md = D.market_data||{};
  after.push(()=>{ const el=$('#btc'); if(!el||!md.btc_1m?.length) return; const ch=mkChart(el); const s=ch.addCandlestickSeries({upColor:css('--win'),downColor:css('--loss'),borderVisible:false,wickUpColor:css('--win'),wickDownColor:css('--loss')}); s.setData(md.btc_1m.map(c=>({time:c[0]+8*3600,open:c[1],high:c[2],low:c[3],close:c[4]}))); ch.timeScale().fitContent(); });
  after.push(()=>{ const el=$('#clc'); if(!el||!md.chainlink?.length) return; const ch=mkChart(el); const s=ch.addLineSeries({color:css('--acc'),lineWidth:2}); s.setData(md.chainlink.map(([t,p])=>({time:t+8*3600,value:p}))); ch.timeScale().fitContent(); });
  after.push(()=>{ const el=$('#pmc'); if(!el||!md.pm_mid?.length) return; const ch=mkChart(el); const s=ch.addLineSeries({color:css('--acc2'),lineWidth:2}); const seen=new Set(); s.setData(md.pm_mid.filter(([t])=>!seen.has(t)&&seen.add(t)).map(([t,sl,m])=>({time:t+8*3600,value:m}))); ch.timeScale().fitContent(); });

function calSVG(cal, lo, hi){
  if(!cal?.length) return '<div class="empty">Needs more resolved predictions.</div>';
  const W=320,H=220,P=30, x=v=>P+(v-lo)/(hi-lo)*(W-2*P), y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const pts = cal.map(c=>`<circle cx="${x(c.pred)}" cy="${y(c.actual)}" r="${Math.min(9,3+Math.sqrt(c.n)/3)}" fill="${css('--acc')}" fill-opacity=".75"><title>predicted ${pct(c.pred)} · actual ${pct(c.actual)} · n=${c.n}</title></circle>`).join('');
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<text x="${x(v)}" y="${H-P+14}" text-anchor="middle">${pct(v,0)}</text><text x="${P-4}" y="${y(v)+3}" text-anchor="end">${pct(v,0)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><rect x="${P}" y="${P}" width="${W-2*P}" height="${H-2*P}" fill="none" stroke="${css('--line')}"/><line x1="${x(lo)}" y1="${y(lo)}" x2="${x(hi)}" y2="${y(hi)}" stroke="${css('--muted')}" stroke-dasharray="4 4"/>${pts}${ticks}<text x="${W/2}" y="${H-2}" text-anchor="middle">predicted</text><text x="8" y="${H/2}" transform="rotate(-90 8 ${H/2})" text-anchor="middle">actual</text></svg>`;
}
