name: PMX weather + arbitrage paper AI

# Runs the Polymarket Weather desk and Arbitrage desk around the clock (paper trading).
# Each job runs ~5h40m, saves its memory to the pmx-data branch, and exits. A new job is queued every hour;
# the concurrency group keeps exactly one running and the next takes over when the last ends.
# PAPER TRADING ONLY: no keys, no wallet, no orders.

on:
  schedule:
    - cron: "33 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # to publish dashboard data + memory to the pmx-data branch

concurrency:
  group: pmx
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      PMX_WORK: ${{ github.workspace }}/pmxwork
      PMX_PUBLISH: ${{ github.workspace }}/pmxpublish
      PMX_TOKEN: ${{ github.token }}
      PMX_MINUTES: "340"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the AI
        run: python pmx/run.py
