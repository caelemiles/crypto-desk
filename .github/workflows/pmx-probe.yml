name: PMX API probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://gamma-api.polymarket.com
          for u in "$G/events/keyset?limit=20" "$G/events/keyset?limit=20&closed=false" "$G/events/keyset?limit=100&closed=false&order=volume24hr&ascending=false" "$G/events?limit=20&closed=false" "$G/events?limit=20" "$G/markets?limit=20&closed=false" "$G/events/keyset?limit=20&tag_slug=weather&closed=false"; do
            echo "== $u"; curl -s -o /tmp/o -w "%{http_code} %{size_download}\n" -H "User-Agent: pm5-paper-bot/1.0 (paper trading research; no orders)" -H "Accept: application/json" "$u"; head -c 300 /tmp/o; echo
            curl -s -o /dev/null -w "plain-curl %{http_code}\n" "$u"
          done
          echo "== weather event sample"
          curl -s -H "Accept: application/json" "$G/events?slug=highest-temperature-in-nyc-on-november-20-2026" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)[0]
          print('DESC', d.get('description'))
          print('RES', d.get('resolutionSource'))
          m=d['markets'][0]
          print('Q', m.get('question'), '|', m.get('groupItemTitle'))
          print('MDESC', m.get('description'))
          print('KEYS', sorted(m.keys()))
          print('FEES', m.get('feesEnabled'), m.get('feeSchedule'), m.get('negRisk'), d.get('negRisk'), d.get('negRiskAugmented'))
          "
